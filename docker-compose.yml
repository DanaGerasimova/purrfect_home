services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: sh -c "alembic -c /app/purrfect_home/alembic.ini upgrade head && uvicorn purrfect_home.app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app/purrfect_home
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      purrfect_db:
        condition: service_healthy
    networks:
      - purrfect_ntwk

  purrfect_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - purrfect_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - purrfect_ntwk

networks:
  purrfect_ntwk:
    driver: bridge

volumes:
  purrfect_db_data:
